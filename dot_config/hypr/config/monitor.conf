# ┃                     Monitor Configuration                   ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Monitor wiki https://wiki.hyprland.org/Configuring/Monitors/
# Match external displays by description so the same config works through a dock.
monitor = desc:Dell Inc. AW2725DF 4547ZZ3, 2560x1440@360, 0x0, 1
monitor = desc:Iiyama North America PL2445H 1227341901450, 1920x1080@100, -1920x0, 1
monitor = eDP-1, preferred, auto-right, 1

workspace = 1, monitor:desc:Dell Inc. AW2725DF 4547ZZ3
workspace = 2, monitor:desc:Dell Inc. AW2725DF 4547ZZ3
workspace = 3, monitor:desc:Dell Inc. AW2725DF 4547ZZ3
workspace = 7, monitor:desc:Iiyama North America PL2445H 1227341901450
workspace = 8, monitor:desc:Iiyama North America PL2445H 1227341901450
workspace = 9, monitor:desc:Iiyama North America PL2445H 1227341901450

# If you need to scale things like steam etc, please uncomment these lines.
#xwayland {
#  force_zero_scaling = true       # Unscale XWayland
#}

# Adjust GDK_SCALE accordingly to your liking.
#env = GDK_SCALE, 1.25                   # GDK Scaling Factor
